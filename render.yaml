services:
  - type: web
    name: tirtira-business-studio
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main_web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: TELEBIRR_NUMBER
        sync: false
      - key: CBE_ACCOUNT
        sync: false
      - key: CBE_NAME
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/tirtira.db
    disk:
      name: tirtira-data
      mountPath: /var/data
      sizeGB: 1
